<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Locator + OCR + TTS + Media Gallery</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.1/dist/tesseract.min.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
  body {
    overflow: hidden;
    margin: 0;
    padding: 0;
  }
  canvas {
    display: block;
  }
  /* Snow effect */
  .snowflake {
    position: fixed;
    top: -10px;
    color: #fff;
    font-size: 1em;
    z-index: 0;
    pointer-events: none;
    user-select: none;
    opacity: 0.8;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes fall {
    0% { transform: translateY(-10px); }
    100% { transform: translateY(110vh); }
  }
*{box-sizing:border-box;margin:0;padding: 5px;}
body{font-family:'Roboto',sans-serif;min-height:100vh;display:flex;flex-direction:column;transition:0.5s;overflow-x:hidden;scroll-behavior:smooth;}
body.dark{background-image:url('assets/bg.jg');}
body.light{background:#f5f5f5;color:#111;}
.parallax-layer{position:fixed;width:100%;height:100%;top:0;left:0;background-position:center;background-size:cover;pointer-events:none;z-index:-3;}
.parallax-top{background-image:;width:10%;height:20%;url('assets/bg.jpg');z-index:-3;}
.parallax-mid{background-image:url('assets/windowlb8g.png');z-index:-2;}
.parallax-bottom{background-image:url('assets/J-round.png');z-index:-1;}
#previewContainer {width: 100%; display: flex; justify-content: center; align-items: center;}
#topLogo {display:block;margin:12px auto;width:80%;border-radius:20px;box-shadow:0 10px 40px rgba(0,255,255,0.5), 0 0 20px rgba(0,255,255,0.3);border:3px solid rgba(0,255,255,0.6);animation: fadePulse 4s ease-in-out infinite;}
@keyframes fadePulse {0% {opacity:1; filter:drop-shadow(0 0 8px rgba(0,255,255,0.7));}50% {opacity:0.1; filter:drop-shadow(0 0 2px rgba(0,255,255,0.2));}100% {opacity:1; filter:drop-shadow(0 0 8px rgba(0,255,255,0.7));}}
#viewerIframe {width: 100%; aspect-ratio: 4 / 2; border: 2px solid #00ffff; border-radius: 14px; background: #000; min-height: 130px; transition: all 0.6s ease;}
body.light #viewerIframe {border-color: #111;}
.container{padding:16px;max-width:580px;margin:0 auto 150px;display:flex;flex-direction:column;gap:12px;}
h1,h3{text-align:center;text-shadow:0 2px 6px rgba(0,200,255,.3);}
h3{margin-top:14px;}
.card{background: rgba(15,25,40,.85); border-radius:16px; padding:14px; box-shadow:0 6px 20px rgba(0,200,255,.3); transition:0.3s;}
body.light .card{background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.15);}
.card:hover{box-shadow:0 8px 28px rgba(0,255,255,.45);}
input, textarea{width:100%;padding:12px;border-radius:12px;background:#0f1928;border:1px solid #334;color:#e6eef8;font-family:monospace;outline:none;}
body.light input,body.light textarea{background:#eee;border:1px solid #ccc;color:#111;}
textarea{min-height:80px;max-height:200px;resize:none;}
button{padding:12px 18px;border-radius:14px;border:none;font-weight:600;cursor:pointer;transition:0.25s;box-shadow:0 4px 12px rgba(0,255,255,.2);background:linear-gradient(145deg,#303a44,#111418);color:#e6eef8;}
body.light button{background:#eee;color:#111;box-shadow:0 4px 12px rgba(0,0,0,.1);}
button:hover{transform:translateY(-3px) scale(1.05);}
button:active{transform:translateY(0) scale(0.98);}
.asset-btn{background:linear-gradient(145deg,#0a1e2c,#0c2c3e);color:#00ffff;border:1px solid rgba(0,255,255,.3);font-size:1em;margin:4px;padding:10px 16px;border-radius:12px;}
body.light .asset-btn{background:#ddd;color:#111;border:1px solid #999;}
.tiny-btn{padding:6px 10px;font-size:0.9em;border-radius:12px;}
#copyBtn{background:linear-gradient(135deg,#00b4ff,#0072ff);color:#fff;font-weight:700;border:none;border-radius:14px;padding:10px 20px;box-shadow:0 4px 12px rgba(0,200,255,.4);transition:all 0.3s ease;}
#copyBtn:hover{transform:scale(1.05);box-shadow:0 6px 18px rgba(0,255,255,.5);}
body.light #copyBtn{background:linear-gradient(135deg,#555,#999);color:#fff;}
#operatorTitle{font-size:1.6em;text-align:center;font-weight:900;margin:10px 0;color:transparent;background:linear-gradient(90deg,#ff00aa,#9d00ff);-webkit-background-clip:text;}
#ocrLoader{display:none;margin:12px auto;width:50px;height:50px;border:6px solid rgba(255,255,255,0.15);border-top:6px solid #00b4ff;border-radius:50%;animation:spin 1.1s linear infinite;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.flex-row{display:flex;gap:8px;flex-wrap:wrap;}
.flex-col{display:flex;flex-direction:column;gap:8px;}
#themeBtn,#mediaBtn{position:fixed;top:12px;padding:10px 16px;border-radius:16px;font-weight:700;box-shadow:0 4px 12px rgba(0,255,255,.3);cursor:pointer;z-index:101;transition:0.3s;}
#themeBtn{right:12px;background:linear-gradient(145deg,#ff00aa,#9d00ff);color:#fff;}
body.light #themeBtn{background:#ccc;color:#111;box-shadow:0 4px 12px rgba(0,0,0,.1);}
#mediaBtn{left:12px;background:linear-gradient(145deg,#00ffdc,#00b4ff);color:#000;}
body.light #mediaBtn{background:#888;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.1);}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background: rgba(15,25,40,0.95);display:flex;justify-content:space-around;padding:10px 0;box-shadow:0 -4px 20px rgba(0,255,255,.3);z-index:100;}
body.light .bottom-nav{background:#eee;box-shadow:0 -4px 20px rgba(0,0,0,.1);}
.nav-btn{flex:1;text-align:center;color:#fff;font-size:0.7em;border:none;background:none;cursor:pointer;transition:0.5s;}
body.light .nav-btn{color:#111;}
.nav-btn:hover{color:#00d0ff;transform:scale(1.1);}
#mediaModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:center;z-index:102;}
#menuModal{background:rgba(15,25,40,.95);padding:10px;border-radius:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;width:90%;max-height:90%;overflow:auto;}
#menuModal button{display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:center;font-size:0.9em;background:#0f1928;color:#00e0ff;opacity:0.9;border:none;border-radius:12px;transition:0.25s;cursor:grab;}
#menuModal button:hover{opacity:1;transform:scale(1.05);}
#menuModal button img{width:60px;height:60px;border-radius:8px;pointer-events:none;}
.pdf-submenu{grid-column:1/-1;background:#2563eb;color:#fff;opacity:1;cursor:pointer;text-align:center;}
#selectedModal{position:fixed;top:5%;left:5%;width:90%;height:90%;background:rgba(0,0,0,.95);display:none;justify-content:center;align-items:center;z-index:103;border-radius:8px;overflow:hidden;}
#selectedModal img{width:100%;height:100%;object-fit:contain;cursor:grab;user-select:none;pointer-events:all;}
#closeModal{position:absolute;top:12px;right:16px;background:url('assets/silver-stby.png') no-repeat center center/contain;color:#000;border:none;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer;z-index:104;box-shadow:0 0 12px rgba(0,0,0,.6);}
#closeModal:hover{background-color:#eee;}
#modalPrev{position:absolute;top:50%;left:10px;transform:translateY(-50%);background:url('assets/leftvarrow.png') no-repeat center center/contain;border:none;border-radius:50%;width:40px;height:40px;cursor:pointer;box-shadow:0 0 12px rgba(0,0,0,.6);z-index:105;}
#modalNext{position:absolute;top:50%;right:10px;transform:translateY(-50%);background:url('assets/rightarrow.png') no-repeat center center/contain;border:none;border-radius:50%;width:40px;height:40px;cursor:pointer;box-shadow:0 0 12px rgba(0,0,0,.6);z-index:105;}
#modalShare{position:absolute;bottom:10px;right:10px;background:url('assets/outlook.png') no-repeat center center/contain;border:none;border-radius:50%;width:40px;height:40px;cursor:pointer;box-shadow:0 0 12px rgba(0,0,0,.6);z-index:105;}
#modalPrev:hover,#modalNext:hover,#modalShare:hover{background-color:#00b4ff;}
.viz canvas {
  position: fixed;
  top: 0px;
  left: 0px;
  width: 100%;
  height: 100%;
  opacity: 0.6;
  z-index: -2;
  pointer-events: none;
}
</style>
</head>
<div class="viz"></div>
<div class="viz canvas">❄️❄️❄️❤️</div>
<body class="dark">
<!-- PARALLAX LAYERS -->
<div class="parallax-layer parallax-top"></div>
<div class="parallax-layer parallax-mid"></div>
<div class="parallax-layer parallax-bottom"></div>
<!-- FLOATING BUTTONS -->
<button id="mediaBtn">🪧<Media/button>
<button id="themeBtn">⚫️💡Theme</button>
<div class="container">
<h1>Asset Locator</h1>
<img id="topLogo" src="https://iili.io/fnSNj8g.gif">
<div class="card flex-row" style="justify-content:center;">
<label for="fileInput" class="tiny-btn" style="background:#0072ff;cursor:pointer;">🖼 Open Image</label>
<input type="file" id="fileInput" accept="image/*" style="display:none;">
<button id="clearBtn" class="tiny-btn">Clear</button>
</div>
<div class="card">
<h3>OCR Preview</h3>
<div id="ocrPreview">OCR text will appear here after processing...</div>
<div id="ocrLoader"></div>
</div>
<div class="card flex-row">
<textarea id="inputText" placeholder="Paste OCR text here or press 'Insert OCR Text'..."></textarea>
<div class="flex-col">
<button id="insertOCRBtn">🖼Insert OCR</button>
<div class="card" style="text-align:right;">
<button id="generateBtn">Generate Buttons</button>
<button id="ttsBtn">🔈Read</button>
<button id="pauseBtn">⏸️</button>
</div>
</div>
</div>
<h3>Preview</h3>
<div id="operatorTitle">Abellio</div>
<div id="previewContainer"><iframe id="viewerIframe"></iframe></div>
<div class="operator-track">
<button class="operatorBtn active" data-name="Abellio" data-template="https://lvf.io/#LDN|TL" data-color="#ef4444">Abellio</button>
<button class="operatorBtn" data-name="Go-Ahead" data-template="https://lvf.io/#LDN|GAL" data-color="#2563eb">Go-Ahead</button>
<button class="operatorBtn" data-name="Stagecoach" data-template="https://lvf.io/#LDN|SLN" data-color="#f97316">Stagecoach</button>
<button class="operatorBtn" data-name="Metroline" data-template="https://lvf.io/#LDN|ML" data-color="#991b1b">Metroline</button>
<button class="operatorBtn" data-name="Arriva" data-template="https://lvf.io/#LDN|AL" data-color="#06b6d4">Arriva</button>
</div>
<div class="card">
<h3>Generated Buttons</h3>
<div id="buttonsContainer"></div>
</div>
<div class="card">
<h3>Extracted Fleet Numbers</h3>
<div id="resultsBox">No results yet.</div>
<div style="text-align:center;"><button id="copyBtn">?�? Copy Fleet Numbers</button></div>
<div style="text-align:center;"><button id="exportImgBtn">?�? Export Preview</button></div>
</div>
</div>
<div class="bottom-nav">
<button class="nav-btn" onclick="scrollToSection('ocrPreview')">OCR</button>
<button class="nav-btn" onclick="scrollToSection('inputText')">Input</button>
<button class="nav-btn" onclick="scrollToSection('buttonsContainer')">Fleet</button>
<button class="nav-btn" onclick="scrollToSection('previewContainer')">Preview</button>
</div>
<div id="mediaModal">
<div id="menuModal"></div>
<div id="selectedModal">
<button id="closeModal"></button>
<img id="modelImage" src="" alt="Model Image">
<button id="modalPrev"></button>
<button id="modalNext"></button>
<button id="modalShare"></button>
</div>
</div>

</body>
</html>
